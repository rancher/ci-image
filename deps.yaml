  # charts-build-scripts is a first-party Rancher tool on the compile-time
  # allowlist. mode: release-checksums means checksums are fetched from the
  # upstream release at generate time; version: latest resolves to the current
  # release tag via the GitHub API. The lock file (deps.lock) records the
  # resolved version and timestamp so CI can detect when it changes.
  - name: charts-build-scripts
    source: rancher/charts-build-scripts
    mode: release-checksums
    version: latest

  - name: ob-charts-tool
    source: rancher/ob-charts-tool
    mode: release-checksums
    version: latest
    release:
      download_template: "ob-charts-tool_{os}_{arch}"
      checksum_template: "ob-charts-tool_{version|trimprefix:v}_checksums.txt"

  # ecm-distro-tools is a collection of tools used by the Release Team
  # to release Rancher, charts, k3s and rke2. Release is the main tool
  # and the only one included here. There are many other tools in the
  # repository, but they aren't as widely used as `release`
  # allowlist. mode: release-checksums means checksums are fetched from the
  # upstream release at generate time; version: latest resolves to the current
  # release tag via the GitHub API. The lock file (deps.lock) records the
  # resolved version and timestamp so CI can detect when it changes.
  - name: release
    source: rancher/ecm-distro-tools
    mode: release-checksums
    version: latest
    release:
      download_template: "release-{os}-{arch}"
      checksum_template: "sha256sum.txt"

  - name: nix
    source: "https://releases.nixos.org/nix"
    mode: static
    version: 2.35.1
    checksums:
      linux/amd64: "c3fe29778acaa93b5095ee66e36f11ec7c6a284c40970a24cc83ac4f04809db3"
      linux/arm64: "79b739996f1751573b4d2b56e4ae607855184c711f2cc1274fa0952a13d4bfc9"
    release:
      download_template: "{source}/nix-{version}/nix-{version}-{arch|replace:amd64=x86_64|replace:arm64=aarch64}-{os}.tar.xz"
      extract: "nix-{version}-{arch|replace:amd64=x86_64|replace:arm64=aarch64}-{os}/"
      install_to_path: false
